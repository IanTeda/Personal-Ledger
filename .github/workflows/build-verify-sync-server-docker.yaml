# .github/workflows/build-verify-sync-server-docker.yaml
#
# Builds the Sync Server's Docker image for each of linux/amd64 and linux/arm64 and
# actually runs each one, proving FC-SYNC-005/NFR.6b ("ships as a multi-arch Docker
# image ... runs on any Docker host"). See the "Sync Server feasibility" Wayfinder map
# (issue #40) and ticket #48. This map's own Notes say no separate CI-matrix ticket
# exists for the Sync Server (it's Docker-only per NFR.6b), so this workflow *is* that
# CI wiring.
#
# Scope: build + verify only, no registry push -- see ticket #48's scope decision.
# Docker Compose with a persistent volume is #49's job, not this workflow's.
#
# Multi-arch strategy: each architecture builds *natively* on its own GitHub-hosted
# runner (ubuntu-24.04 for amd64, ubuntu-24.04-arm for arm64) rather than
# cross-compiling or emulating the non-native arch under QEMU -- a real native build is
# both faster and a more faithful proof than an emulated one, the same reasoning
# build-publish-tui.yaml already applied by using real macOS/Windows runners instead of
# cross-compiling from Linux. `ubuntu-24.04-arm` is unverified from this repo's dev
# sandbox (no way to test GitHub-hosted runner availability locally) -- first exercised
# for real on this workflow's first run, same honesty bar the TUI workflow's own
# macOS/Windows legs were held to.
#
# Triggered the same way build-publish-tui.yaml is: a GitHub Release (packaging on
# every push is expensive and most pushes don't need it), plus workflow_dispatch to
# re-run the same build/verify pipeline on demand.

name: Build and Verify Sync Server Docker Image

on:
  release:
    types: [created]
  workflow_dispatch:
  # TEMPORARY, remove after the first run: workflow_dispatch can't target a workflow
  # that's never run and isn't on the default branch yet, so this bootstraps GitHub's
  # registration of it. Drop this trigger once the first run completes.
  push:
    branches: [feasibility]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this workflow never pushes an image or writes to the release (see the
# scope note above), so it never needs contents: write the way build-publish-tui.yaml's
# release-upload steps do.
permissions:
  contents: read

jobs:
  build-verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-24.04
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    # A from-scratch Rust release build (no layer cache yet) inside Docker can run
    # 10-20+ min; bounded generously rather than left uncapped, same rationale
    # build-publish-tui.yaml gives its own per-job timeout.
    timeout-minutes: 40
    steps:
      # https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@v7

      # buildx is used even for a single-platform --load build (rather than plain
      # `docker build`) so this workflow's build step is already in the shape a later
      # multi-platform --push (e.g. for an actual release) would need, without
      # requiring a rewrite when that's added.
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds for this leg's own native architecture only (matrix.platform), loaded
      # into the local Docker daemon so it can actually be run and verified below --
      # `--load` only supports a single platform at a time, which is exactly what each
      # matrix leg needs; the combined multi-arch manifest is a registry-push concern
      # this ticket deliberately doesn't do (see the workflow header's scope note).
      - name: Build image (${{ matrix.platform }})
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --tag sync-server:test \
            --load \
            .

      - name: Run image
        run: |
          docker run -d --name sync-server-test -p 50051:50051 sync-server:test
          # Give the container a moment to bind its port before the checks below poll it.
          sleep 2

      # Confirms the *running sync-server process* isn't root (NFR.2) -- not a plain
      # `docker exec ... id -u`, which would report the exec session's own default
      # user (root, per the image's PUID/PGID entrypoint design in docker-entrypoint.sh:
      # the container starts as root so it can chown /data and drop privileges via
      # setpriv, so a fresh `docker exec` without --user inherits that root context
      # too, regardless of what the actual PID 1 process dropped to). `docker top`
      # reports the real per-process UID from the host's view instead, mirroring
      # build-publish-tui.yaml's own `[ "$(id -u)" -ne 0 ]` non-root proof for the
      # packaged AppImage/dmg, adapted for a process running inside a container rather
      # than directly on the runner.
      - name: Verify the sync-server process runs as non-root
        run: |
          set -euo pipefail
          docker top sync-server-test -eo pid,user,comm
          uid=$(docker top sync-server-test -eo user,comm | awk '$2 == "sync-server" { print $1 }')
          echo "sync-server process uid: $uid"
          [ -n "$uid" ]
          [ "$uid" != "0" ]
          [ "$uid" != "root" ]

      # grpcurl needs either server reflection (not registered on UtilitiesService) or
      # the .proto file directly -- same proto-file-driven approach ticket #41 already
      # used to verify Ping end-to-end. `go install` works identically on both matrix
      # legs without hardcoding a per-arch release-binary URL; Go ships preinstalled on
      # GitHub-hosted Ubuntu runners (amd64 and arm64 alike).
      - name: Install grpcurl
        run: go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest

      - name: Verify Ping over gRPC
        run: |
          set -euo pipefail
          response=$("$(go env GOPATH)/bin/grpcurl" \
            -plaintext \
            -import-path crates/libs/lib-rpc/proto \
            -proto personal-ledger/v001/utilities.proto \
            localhost:50051 \
            personal_ledger.utilities.v001.UtilitiesService/Ping)
          echo "$response"
          echo "$response" | grep -q "Pong"

      # Always useful for diagnosing a failed run; cheap to print unconditionally.
      - name: Show container logs
        if: always()
        run: docker logs sync-server-test || true

      - name: Stop container
        if: always()
        run: docker rm -f sync-server-test || true

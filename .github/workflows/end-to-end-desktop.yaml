# .github/workflows/end-to-end-desktop.yaml
#
# Headless keyboard and mouse integration tests for `bin-desktop` (the "Desktop UI Integration
# Testing" Wayfinder map, issue #443; ADR-0030). They drive the real `Shell`, key router and
# mouse handlers in process through gpui's `test-support`, so no window, GPU or display server
# is needed. This is not a real-window end-to-end test: that stays a manual visual check.
#
# Runs in two ways:
#   - directly, on pushes and pull requests to `main`, alongside lint-main-push.yaml;
#   - as a reusable workflow (`workflow_call`) from build-publish-desktop.yaml, whose build
#     matrix `needs` it, so a release or manual desktop build never packages a UI regression.
#
# Linux only: the tests exercise UI logic, not platform rendering, so one runner is enough.
# The suite is the `test-ui` mise task, so a local `mise run test-ui` runs exactly what CI runs.

name: Desktop UI End-to-End

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reused by build-publish-desktop.yaml so a release or manual build is gated on these tests.
  workflow_call:

jobs:
  test-ui:
    runs-on: ubuntu-latest
    env:
      # As in lint-main-push.yaml: no DATABASE_URL in CI, so lib-database checks against `.sqlx`.
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise-pinned toolchain
        uses: jdx/mise-action@v4

      # The tests run through gpui's in-process test platform (ADR-0030), so there is no window,
      # GPU or X server and no Xvfb here, unlike build-publish-desktop.yaml's real-window smoke
      # test. gpui still links against the system windowing libraries at build time, so those
      # packages are needed; adjust the list against the first real run.
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake lld \
            libfontconfig-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev

      - name: Run Desktop UI tests
        run: mise run test-ui

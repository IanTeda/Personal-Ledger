# .github/workflows/build-publish-documentation.yaml
#
# Builds the mdBook documentation site and deploys it to GitHub Pages.
# Triggered when a GitHub Release is published. A `workflow_dispatch` entry
# lets maintainers rebuild the docs on demand without cutting a release —
# convenient when only documentation content has changed.
#
# GitHub Pages must be configured to use "GitHub Actions" as the source:
#   Settings → Pages → Source → GitHub Actions
#

name: Build And Publish Documentation

on:
  release:
    types: [created]
  workflow_dispatch:
  # # Uncomment to re-test the workflow on develop pushes. Re-comment (or
  # # remove) once verified — the release trigger above is the intended
  # # long-term behaviour.
  # push:
  #   branches: ["develop"]

# Serialise page deployments so a rapid re-publish can't race two jobs
# writing to the same Pages environment. `cancel-in-progress: true` drops
# the stale run in favour of the newest one.
concurrency:
  group: github-pages
  cancel-in-progress: true

# Least-privilege token: only the three scopes required for Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@v7

      # Only mdBook is needed to build the docs, so install just that
      # prebuilt binary rather than the full mise-pinned toolchain (Rust,
      # protoc, cargo-make, sqlx-cli, ...), and without a third-party Action.
      # Version is read from mise.toml so the two stay in sync without
      # hardcoding it twice.
      - name: Install mdBook
        run: |
          set -euo pipefail
          version=$(grep -Po '(?<=^mdbook = ")[^"]+' mise.toml)
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${version}/mdbook-v${version}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin

      - name: Build documentation
        run: mdbook build

      # https://github.com/actions/upload-pages-artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/mdbook/

      # https://github.com/actions/deploy-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

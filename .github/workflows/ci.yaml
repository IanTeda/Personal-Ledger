# .github/workflows/ci.yaml
#
# Cross-platform build/test matrix (Linux, macOS, Windows), added to prove the
# TUI feasibility work (docs/product-requirements.md FC-TUI-002/003/004) runs
# identically everywhere without manual multi-machine testing. See the "TUI
# App feasibility" Wayfinder map (issue #7) and ticket #13.
#
# Scoped to `crates/bins/tui`, not the whole workspace -- but as of ticket #22
# (FC-TUI-005) `tui` depends on `lib_database`/`lib_domain` directly, so its
# `.sqlx` query cache (regenerated in that ticket, including test targets) is
# already exercised by the steps below. Widening further to `--workspace`
# still isn't safe: `lib_rpc` has its own stale `.sqlx` test-target cache,
# unrelated to the TUI and out of this map's scope -- widen once that's fixed
# elsewhere, or once a later ticket needs the wider build.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      # https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@v7

      # Installs the pinned Rust toolchain from mise.toml identically on all
      # three runner OSes, so CI uses exactly what a local `mise install`
      # would.
      # https://github.com/jdx/mise-action
      - name: Install mise-pinned toolchain
        uses: jdx/mise-action@v4

      - name: Build tui
        run: cargo build --locked --package tui

      - name: Test tui
        run: cargo test --locked --package tui

      # Was an empty scaffold at ticket #13; now an interactive multi-screen demo
      # (tickets #14-18/#22) -- this is the "where possible runs" half of FC-TUI-004,
      # proving the compiled binary actually launches on each OS. CI runners provide no
      # real TTY, so raw-mode terminal setup fails immediately by design (confirmed
      # locally: `Os { code: 6, .. "No such device or address" }`). On Linux we simulate
      # a TTY via `script` and send `q` to confirm the binary genuinely starts and quits
      # cleanly; macOS/Windows still run the bare binary as before -- their own
      # TTY-simulation approach is for tickets #20/#19 to work out.
      - name: Run tui (smoke test, Linux)
        if: runner.os == 'Linux'
        run: echo q | script -qec "cargo run --locked --package tui" /dev/null

      - name: Run tui (smoke test, macOS/Windows)
        if: runner.os != 'Linux'
        run: cargo run --locked --package tui

      # Linux-only: packages tui as a non-root AppImage per ADR-0004
      # (docs/adr/0004-cargo-packager-plus-hand-rolled-windows-zip.md) and confirms it
      # actually runs -- proving FC-TUI-004's Linux non-root requirement end-to-end, not
      # just that `cargo packager` exits 0. See ticket #21.
      - name: Install cargo-packager (Linux)
        if: runner.os == 'Linux'
        run: cargo install cargo-packager --locked

      - name: Package tui as AppImage (Linux)
        if: runner.os == 'Linux'
        run: cargo packager --release --formats appimage --manifest-path crates/bins/tui/Cargo.toml

      - name: Verify AppImage runs non-root (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          appimage=$(find target/release -maxdepth 1 -name '*.AppImage')
          chmod +x "$appimage"
          echo "Running as: $(whoami) (uid $(id -u))"
          [ "$(id -u)" -ne 0 ]
          echo q | script -qec "$appimage --appimage-extract-and-run" /dev/null

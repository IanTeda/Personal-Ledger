# .github/workflows/ci.yaml
#
# Cross-platform build/test matrix (Linux, macOS, Windows), added to prove the
# TUI feasibility work (docs/product-requirements.md FC-TUI-002/003/004) runs
# identically everywhere without manual multi-machine testing. See the "TUI
# App feasibility" Wayfinder map (issue #7) and ticket #13.
#
# Scoped to `crates/bins/tui`, not the whole workspace -- but as of ticket #22
# (FC-TUI-005) `tui` depends on `lib_database`/`lib_domain` directly, so its
# `.sqlx` query cache (regenerated in that ticket, including test targets) is
# already exercised by the steps below. Widening further to `--workspace`
# still isn't safe: `lib_rpc` has its own stale `.sqlx` test-target cache,
# unrelated to the TUI and out of this map's scope -- widen once that's fixed
# elsewhere, or once a later ticket needs the wider build.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      # https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@v7

      # Installs the pinned Rust toolchain from mise.toml identically on all
      # three runner OSes, so CI uses exactly what a local `mise install`
      # would.
      # https://github.com/jdx/mise-action
      - name: Install mise-pinned toolchain
        uses: jdx/mise-action@v4

      - name: Build tui
        run: cargo build --locked --package tui

      - name: Test tui
        run: cargo test --locked --package tui

      # Empty scaffold today (`fn main() {}`), but this is the "where
      # possible runs" half of FC-TUI-004: proves the compiled binary
      # actually launches on each OS, not just that it compiles.
      - name: Run tui (smoke test)
        run: cargo run --locked --package tui

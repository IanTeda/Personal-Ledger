name: Lint on Main Push or Pull

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # No DATABASE_URL in CI: lib-database's query macros check against the checked-in `.sqlx`
      # cache. Setting this makes a stale cache fail with "no cached data for this query" rather
      # than a confusing request for DATABASE_URL. Regenerate with `mise run db-prepare-generate`.
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise-pinned toolchain
        uses: jdx/mise-action@v4

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Dependency policy (deny.toml). Advisories are split out and non-blocking so a newly published
  # RustSec advisory against an existing dependency doesn't fail unrelated pushes; licences, bans
  # and sources only change when Cargo.lock does, so those block.
  deny:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks: [advisories, "bans licenses sources"]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise-pinned toolchain
        uses: jdx/mise-action@v4

      - name: Run cargo-deny
        run: cargo deny check ${{ matrix.checks }}

# cargo-deny configuration: dependency policy checked by `mise run deny` and the Lint workflow's
# `deny` job. See https://embarkstudios.github.io/cargo-deny/.

[graph]
all-features = true

# RustSec advisories. CI runs this check non-blocking, since new advisories land against existing
# dependencies without any change on our side.
[advisories]
version = 2
# Inside the repo (gitignored `target/`) rather than `~/.cargo`, so a sandboxed agent that can't
# write `~/.cargo` can still lock and fetch the database.
db-path = "target/advisory-dbs"
yanked = "deny"
# Only flag unmaintained crates we depend on directly; transitive ones (mostly under gpui) are the
# upstream crate's to replace, and we can't act on them.
unmaintained = "workspace"
# Each ignore needs the advisory id and a reason, e.g.
# { id = "RUSTSEC-0000-0000", reason = "not reachable: we never call the affected API" },
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa is pulled in by jsonwebtoken, but the Sync Server signs and verifies HS256 only (bin-sync-server/src/auth/jwt.rs), so no RSA key is ever used; no patched rsa exists yet" },
  { id = "RUSTSEC-2026-0381", reason = "flags webpki-roots 0.26.11, which sqlx 0.8 pins; 0.26.11 bundles no certificates of its own but re-exports webpki-roots 1.x, locked at the patched 1.0.10. Remove once sqlx moves to webpki-roots 1.x (added 2026-10-21)" },
]

# Licences must keep the shipped binaries distributable under this project's MIT licence, so
# permissive and file-level copyleft (MPL-2.0) only. Workspace crates are `publish = false`
# and skipped via `private.ignore`. Crates offering a choice (e.g. `Apache-2.0 OR GPL-2.0-only`)
# pass as long as one option is allowed here.
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = true

# Duplicate versions are reported but not failed: the gpui/sqlx/tonic trees pull in several
# unavoidable duplicates, and chasing them isn't worth blocking a push.
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# The VIPER dependency rules (docs/development/viper-architecture.md, Rules > Dependencies): a UI
# toolkit belongs to its own bin, and only bins reach `lib_database`, so every lib stays
# toolkit-free and I/O-free. A crate listed in `deny` may only be a direct dependency of its
# `wrappers`, so a new lib such as `lib_viper` is banned by not being listed; the third-party
# wrappers are the toolkits' own companion crates. `lib_rpc` is the Sync Server's service layer
# and predates the rule, so it keeps `lib_database` for now. A cross-domain module is reached only
# by the bins and the adapter that implements its port, so no feature crate depends on it (the
# `cargo metadata` test in `lib-ledger` checks the same, and what the module itself depends on).
deny = [
  { crate = "gpui", wrappers = ["bin_desktop", "gpui-component"], reason = "UI toolkit: only bin-desktop may depend on it (VIPER Dependencies rule)" },
  { crate = "gpui-component", wrappers = ["bin_desktop"], reason = "UI toolkit: only bin-desktop may depend on it (VIPER Dependencies rule)" },
  { crate = "ratatui", wrappers = ["bin_tui", "tui-piechart"], reason = "UI toolkit: only bin-tui may depend on it (VIPER Dependencies rule)" },
  { crate = "crossterm", wrappers = ["bin_tui", "ratatui-crossterm"], reason = "UI toolkit: only bin-tui may depend on it (VIPER Dependencies rule)" },
  { crate = "lib_database", wrappers = ["bin_desktop", "bin_tui", "bin_sync_server", "lib_rpc"], reason = "persistence adapter: only bins may depend on it (VIPER Dependencies rule)" },
  { crate = "lib_bill_payments", wrappers = ["bin_desktop", "lib_database"], reason = "cross-domain module: only the bins and its adapter may depend on it (VIPER Dependencies rule)" },
]

# Only crates.io, plus any git dependency listed in `allow-git`.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

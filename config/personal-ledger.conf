# Personal Ledger Configuration File
#
# Configuration for the Personal Ledger Clients (bin-tui, bin-desktop) and the Sync Server
# (bin-sync-server). INI format: sections with key-value pairs. Every setting has a
# built-in default, so every key below is optional -- delete whatever you don't need.
#
# Settings writes the THIS DEVICE sections, [General], [Display] and [Logs], key by key
# as you change them (ADR-0053, ADR-0057): each Settings page owns the section named for it.
# [Theme*], [Keybindings] and [Sync-Server] are hand-edited; Settings never writes them.
# Section names are case-insensitive, and `-` and `_` are interchangeable, so [Sync-Server],
# [sync-server] and [sync_server] all name the same section.
#
# This file holds Configuration only (ADR-0014): what the app needs before it, or its
# database, can start. A shipped key shows its default, or an example, commented out.
#
# The reference for every key, its environment variable and its precedence is
# docs/settings.md.


# Settings › General. The file is chosen with --config only, never by a key here.
[General]

# Which Ledger file a Client opens as it starts: "reopen" or "none"
# on_start = reopen

# The View a Client lands on as it starts: "dashboard", "last", "settings" or a noun
# start_view = dashboard

# Whether non-Error Toasts show
# toasts = true

# Optional: the interface Locale, as a BCP-47 tag -- "en-US", "en-GB" or "en-AU".
# When absent, the operating system's locale is used, falling back to "en-US".
# locale = "en-AU"

# Client data directory: the folder `:open` starts in
data = "~/Documents/Personal-Ledger"

# Optional: a Ledger file to open at start, overriding On start. Usually left unset, so the
# Client reopens the last Ledger, or none, as On start says.
# file = "~/Documents/Personal-Ledger/My-Personal-Ledger.pldb"


# Settings › Display. Each shows its default.
[Display]

# The Colour Theme to draw in, by its id. An id this release doesn't know draws Modernist
# and is kept, so a newer release's Colour Theme survives.
# Valid values: "modernist", "high_contrast", "catppuccin", "gruvbox", "nord"
# colour_theme = modernist

# Which version of the Colour Theme to draw. "system" follows your computer or terminal.
# Valid values: "light", "dark", "system"
# colour_appearance = system

# How dates show. "short", "medium" and "long" pick one of the Locale's date forms, "iso"
# shows 2026-07-01 whatever the Locale, and "default" uses the Locale's usual form.
# Valid values: "default", "short", "medium", "long", "iso"
# date_style = default

# How tightly table rows, such as Transactions, are spaced. Only the Desktop reads it.
# Valid values: "compact", "regular", "roomy"
# row_density = regular

# "unicode" draws status glyphs such as ● ◐ ⚑; "ascii" draws plain stand-ins such as x o !,
# for a font that lacks them. The TUI saves it but doesn't draw with it yet.
# Valid values: "unicode", "ascii"
# status_glyphs = unicode

# Whether the Desktop starts with the primary rail collapsed at Large and X-Large window
# sizes, where it is otherwise expanded. Applies on the next start. Only the Desktop reads it.
# start_sidebar_minimised = false

# When false, the footer shows only the mode (NORMAL, INSERT …), not the keys the screen
# takes. Only the TUI reads it.
# hint_bar = true

# When true, ignore the Colour Theme and any [Theme] overrides and draw in the terminal's
# own ANSI colours, so your terminal theme wins. Only the TUI reads it.
# terminal_colours = false


# Settings › Logs, read by all three binaries.
[Logs]

# Tracing log level
# Valid values: "trace", "debug", "info", "warn", "error", "off"
log = "debug"

# Optional: also write log output to this file, in addition to the console
# log_file_path = "/var/log/personal-ledger/personal-ledger.log"


# Keyboard navigation keys and key combinations. Read by bin-tui and bin-desktop; the Sync
# Server merges the defaults in but never reads them -- a headless server has no keyboard.
# Command names are open-ended, so new screens can add their own. Binding two commands to
# the same key is a startup error.
[Keybindings]

# The modifier held down for global shortcuts (mirrors a window manager's mod/prefix key).
# Valid values: "ctrl", "alt", "shift", "super", "none"
super_key = "ctrl"

# Go back in the view stack
back = "esc"

# Help screen
help = "?"

# Open the command popup
open_command_popup = ":"

# Move up in a list
move_up = "k"

# Move down in a list
move_down = "j"

# Select the highlighted item
select = "enter"

# Create a new item
new = "n"

# Delete an item
delete = "d"

# Confirm an action
confirm = "y"

# Cancel an action
cancel = "x"
dismiss_toasts = "ctrl+l"
# toast_history = "ctrl+t"

# Note: `quit` is deliberately not configurable here. bin-tui has three separate, hardcoded
# quit mechanisms (Ctrl+C hard-quit, Q/q graceful quit, and the `:quit` command), none of
# which read this section -- see docs/navigation-design.md.


# Optional: override Colour Roles of the chosen Colour Theme on this Client.
# A bare [Theme] key applies to both Colour Variants; [Theme.Light] and [Theme.Dark]
# apply to one and win over the bare key. Name only the roles you want to change.
# [Theme]
# foreground = "#1F2328"
# background = "#FFFFFF"
# accent = "#1F6FEB"
# cursor = "#1F6FEB"
# muted = "#656D76"
# positive = "#1A7F37"
# negative = "#CF222E"
# [Theme.Light]
# foreground = "#1F2328"
# background = "#FFFFFF"
# accent = "#1F6FEB"
# cursor = "#1F6FEB"
# muted = "#656D76"
# positive = "#1A7F37"
# negative = "#CF222E"
# [Theme.Dark]
# foreground = "#E6EDF3"
# background = "#0D1117"
# accent = "#58A6FF"
# cursor = "#58A6FF"
# muted = "#8B949E"
# positive = "#3FB950"
# negative = "#F85149"

# Only read by bin-sync-server -- bin-tui and bin-desktop ignore this section entirely.
[Sync-Server]

# The address and port the Sync Server listens on. The gRPC services and the auth HTTP
# endpoints share this one listener (ADR-0010), so there is no second port.
bind_address = "0.0.0.0:50051"

# The Sync Server's own database, holding the Change Set log and its single sync user.
# This is never a Client's Ledger file.
database_uri = "sqlite:./sync-server.sqlite"

# Personal Ledger Configuration File
#
# Configuration for the Personal Ledger Clients (bin-tui, bin-desktop) and the Sync Server
# (bin-sync-server). INI format: sections with key-value pairs. Every setting has a
# built-in default, so every key below is optional -- delete whatever you don't need.
#
# Section names are case-insensitive, and `-` and `_` are interchangeable, so
# [Personal-Ledger], [personal-ledger] and [personal_ledger] all name the same section.
#
# Per ADR-0014 this file holds Configuration only: what the app needs before it (or its
# database) can start. Anything you would change from inside a running Client -- colour
# theme, date style, default Unit -- is a Preference, stored in the Ledger's own database,
# not here. Connection-pool tuning is fixed in code and is not configurable.
#
# For more information, see the documentation at docs/settings.md


# Settings applied across Personal Ledger files and the Client on a given system, read by
# all three binaries. Not intended to sync between computers.
[Personal-Ledger]

# Points to a configuration file outside the normal search hierarchy. Usually left unset.
# config = "~/.config/personal-ledger/personal-ledger.conf"

# Client data directory, the default location for Personal Ledger database files
data = "~/Documents/Personal-Ledger"

# The Personal Ledger database file to open when none is given
file = "~/Documents/Personal-Ledger/My-Personal-Ledger.pldb"

# Client tracing log level
# Valid values: "trace", "debug", "info", "warn", "error", "off"
log = "debug"

# Optional: also write log output to this file, in addition to the console
# log_file_path = "/var/log/personal-ledger/personal-ledger.log"

# Optional: the interface Locale, as a BCP-47 tag -- "en-US", "en-GB" or "en-AU".
# When absent, the operating system's locale is used, falling back to "en-US".
# locale = "en-AU"


# Keyboard navigation keys and key combinations. Read by bin-tui and bin-desktop; the Sync
# Server merges the defaults in but never reads them -- a headless server has no keyboard.
# Command names are open-ended, so new screens can add their own. Binding two commands to
# the same key is a startup error.
[keybindings]

# The modifier held down for global shortcuts (mirrors a window manager's mod/prefix key).
# Valid values: "ctrl", "alt", "shift", "super", "none"
super_key = "ctrl"

# Go back in the view stack
back = "esc"

# Help screen
help = "?"

# Open the command popup
open_command_popup = ":"

# Move up in a list
move_up = "k"

# Move down in a list
move_down = "j"

# Select the highlighted item
select = "enter"

# Create a new item
new = "n"

# Delete an item
delete = "d"

# Confirm an action
confirm = "y"

# Cancel an action
cancel = "x"

# Note: `quit` is deliberately not configurable here. bin-tui has three separate, hardcoded
# quit mechanisms (Ctrl+C hard-quit, Q/q graceful quit, and the `:quit` command), none of
# which read this section -- see docs/navigation-design.md.


# Only read by bin-sync-server -- bin-tui and bin-desktop ignore this section entirely.
[Sync-Server]

# The address and port the Sync Server listens on. The gRPC services and the auth HTTP
# endpoints share this one listener (ADR-0010), so there is no second port.
bind_address = "0.0.0.0:50051"

# The Sync Server's own database, holding the Change Set log and its single sync user.
# This is never a Client's Ledger file.
database_uri = "sqlite:./sync-server.sqlite"

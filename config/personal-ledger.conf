# Personal Ledger Configuration File
#
# This file contains configuration settings for the Personal Ledger application.
# It uses INI format with sections and key-value pairs. All settings have hard coded
# defaults and are thus optional.
#
# Section names are case-insensitive (e.g., [Telemetry] or [telemetry] both work).
# Values should be quoted strings where appropriate.
#
# There are two levels of configuration, static and dynamic. Static or bootstrap
# configuration is loaded from this file, while dynamic configuration is loaded from the database. Static
# configuration is used to bootstrap the database connection, while dynamic configuration is used for
# application settings.
#
# For more information, see the documentation at docs/src/configuration.md

[Database]
# SQLite database connection url
#   - `sqlite:./personal-ledger.sqlite` (relative path)
#   - `sqlite:/tmp/personal-ledger.db` (absolute path)
#   - `sqlite::memory:` (in-memory database)
url = "sqlite:./personal-ledger.sqlite"

# The maximum number of connections to the database
max_connections = 10

# The minimum number of connections to the database
min_connections = 1

# The timeout in seconds for acquiring a connection
acquire_timeout_seconds = 30

# The timeout in seconds for idle connections
idle_timeout_seconds = 600

# The maximum lifetime in seconds for a connection
max_lifetime_seconds = 1800

# Keybindings for the application
[keybindings]
# The modifier held down for global shortcuts (mirrors a window manager's mod/prefix key).
# Valid values: "ctrl", "alt", "shift", "super", "none"
super_key = "ctrl"

# Quit the application
quit = "ctrl+c"

# Go back in the application screen stack
back = "esc"

# Help screen
help = "?"

# Move up in list
move_up = "k"

# Move down in the list
move_down = "j"

# Select an item in the list
select = "enter"

# Insert a new item
insert = "i"

# Delete an item
delete = "d"

# Update an item
update = "u"

# Next item in the list
next = "l"

# Previous item in the list
prev = "h"

# Confirm an action
confirm = "y"

# Cancel an action
cancel = "x"

[Tracing]
# Enable tracing
enabled = true

# Logging level for tracing output
# Valid values: "trace", "debug", "info", "warn", "error", "off"
level = "trace"

# Show configuration at startup.
show_at_startup = true

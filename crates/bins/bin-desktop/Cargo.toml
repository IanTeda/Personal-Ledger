[package]
name = "bin_desktop"
version = "0.1.0"
edition = "2024"
# Never published to crates.io; also lets cargo-deny skip licence checks on workspace crates.
publish = false

# Package name is bin_desktop (matching the lib_* convention for library crates), but the
# compiled binary itself stays named `desktop` -- end users running the packaged app shouldn't
# see the bin_ prefix; it's a codebase-navigation convention, not a user-facing one.
[lib]
doctest = false

[[bin]]
name = "desktop"
path = "src/main.rs"

[features]
# Turns on gpui's in-process test support, which also makes the `debug_selector` tags the
# integration tests click take effect (without it gpui compiles them to no-ops). Only the self
# dev-dependency below enables it, so shipped builds never compile gpui's test support.
test-support = ["gpui/test-support"]

[dependencies]
## -- Internal Dependencies --
lib_accounts = { path = "../../libs/lib-accounts" }
lib_bills = { path = "../../libs/lib-bills" }
lib_categories = { path = "../../libs/lib-categories" }
lib_transactions = { path = "../../libs/lib-transactions" }
lib_colour_theme = { path = "../../libs/lib-colour-theme" }
lib_config = { path = "../../libs/lib-config" }
lib_database = { path = "../../libs/lib-database" }
lib_core = { path = "../../libs/lib-core" }
lib_locale = { path = "../../libs/lib-locale" }
lib_toast = { path = "../../libs/lib-toast" }
lib_tracing = { path = "../../libs/lib-tracing" }

## -- Workspace Dependencies --
bigdecimal = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

## -- Crate Dependencies --
gpui = { version = "0.2.2" }
gpui-component = { version = "0.5.1" }

[build-dependencies]
lib_locale_build = { path = "../../libs/lib-locale-build" }

[dev-dependencies]
bin_desktop = { path = ".", features = ["test-support"] }
tempfile = { workspace = true }
fake = { workspace = true }

[lints]
workspace = true

# cargo-packager config for all three installer formats, FC-DESKTOP-004. See ADR-0008
# (docs/adr/0008-cargo-packager-for-desktop.md): the same tool as the TUI (ADR-0004), all
# three formats from one config -- Windows NSIS (ticket #34), macOS dmg (ticket #35), Linux
# AppImage (ticket #36). Each format is a no-op on the "wrong" OS, so listing all three is
# safe on every platform's CI leg.
[package.metadata.packager]
product-name = "Personal Ledger Desktop"
identifier = "au.id.teda.personal-ledger.desktop"
formats = ["nsis", "dmg", "appimage"]
# The "Totals rule" app icon (light set) copied from the handoff in docs/ux/Logo/ -- packager
# paths are crate-relative. The PNGs feed the AppImage hicolor sizes, `.icns` the dmg and
# `.ico` Windows. Square corners are deliberate: don't round or mask the tile.
icons = [
    "icons/app-icon-16.png",
    "icons/app-icon-32.png",
    "icons/app-icon-48.png",
    "icons/app-icon-64.png",
    "icons/app-icon-128.png",
    "icons/app-icon-256.png",
    "icons/app-icon-512.png",
    "icons/app-icon.icns",
    "icons/app-icon.ico",
]

# Not strictly required now that the CI invocation passes `--packages bin_desktop` (the
# real fix for cargo-packager trying to bundle bin-tui's `tui.exe` -- see the CI workflow's
# comment on the packaging step for the full explanation), but kept explicit anyway: with
# two `[[bin]]` targets now in the workspace, auto-detection is one less thing to trust.
[[package.metadata.packager.binaries]]
path = "desktop"
main = true

# `currentUser` is NSIS's documented default install mode already (no elevation, no
# Administrator prompt) -- set explicitly so the non-root intent (NFR.2) is visible in the
# config itself, not just relied on implicitly. Field is `installer_mode` (or
# `installerMode`), not `install_mode` -- docs.rs's NsisConfig page shows the Rust builder
# method `install_mode()`, but that's not the same name as the serde field cargo-packager
# actually deserialises from Cargo.toml -- confirmed for real on the first CI run, which
# rejected `install_mode` and listed `installer_mode`/`installerMode` as the accepted
# spellings.
[package.metadata.packager.nsis]
installer_mode = "currentUser"

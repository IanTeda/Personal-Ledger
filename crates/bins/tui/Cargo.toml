[package]
name = "tui"
version = "0.1.0"
edition = "2024"

[dependencies]
## -- Internal Dependencies --
lib_database = { path = "../../libs/lib-database" }
lib_domain = { path = "../../libs/lib-domain" }

## -- Workspace Dependencies --
chandelier = { workspace = true }
chrono = { workspace = true }
crossterm = { workspace = true }
futures-util = { workspace = true }
ratatui = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

# cargo-packager config for the Linux AppImage build (ticket #21, FC-TUI-004).
# AppImage is the only Linux format produced -- see ADR-0004
# (docs/adr/0004-cargo-packager-plus-hand-rolled-windows-zip.md): a `.deb`
# conventionally wants root (Debian Policy), in tension with NFR.2, while
# AppImage runs with no installation step and no root at all.
[package.metadata.packager]
product-name = "Personal Ledger TUI"
identifier = "au.id.teda.personal-ledger.tui"
formats = ["appimage"]
# Placeholder only -- a plain square, no branding yet. AppImage packaging
# requires a square icon; swap for real artwork when the app has any.
icons = ["icons/icon-256.png"]

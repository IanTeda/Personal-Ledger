[package]
name = "bin_tui"
version = "0.1.0"
edition = "2024"
# Never published to crates.io; also lets cargo-deny skip licence checks on workspace crates.
publish = false
license.workspace = true

[lib]
# Doc tests are not used here: usage is specified by unit and integration tests (CLAUDE.md).
doctest = false

# Package name is bin_tui (matching the lib_* convention for library crates), but the
# compiled binary itself stays named `tui` -- end users running the packaged app shouldn't
# see the bin_ prefix; it's a codebase-navigation convention, not a user-facing one.
[[bin]]
name = "tui"
path = "src/main.rs"

[dependencies]
## -- Internal Dependencies --
lib_config = { path = "../../libs/lib-config" }
lib_database = { path = "../../libs/lib-database" }
lib_core = { path = "../../libs/lib-core" }
lib_colour_theme = { path = "../../libs/lib-colour-theme" }
lib_locale = { path = "../../libs/lib-locale" }
lib_toast = { path = "../../libs/lib-toast" }
lib_tracing = { path = "../../libs/lib-tracing" }

## -- Workspace Dependencies --
bigdecimal = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
regex = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

## -- Crate Dependencies --
chandelier = { version = "0.4.0" }
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = { version = "0.30.2" }
tui-box-text = { version = "0.3.4" }
tui-piechart = { version = "1.0.2" }

# Polls stdin with a timeout for the start-up terminal colour probe (`detect.rs`), safely.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["event"] }

[build-dependencies]
lib_locale_build = { path = "../../libs/lib-locale-build" }

[lints]
workspace = true

# cargo-packager config for the Linux AppImage (ticket #21) and macOS dmg
# (ticket #20) builds, FC-TUI-004. See ADR-0004
# (docs/adr/0004-cargo-packager-plus-hand-rolled-windows-zip.md): no `.deb`
# (conventionally wants root per Debian Policy, in tension with NFR.2) --
# AppImage on Linux and a dmg on macOS instead, neither needing root or an
# installation step. No code signing this cycle (ADR-0004). Each format is a
# no-op on the "wrong" OS -- `cargo packager` just warns and skips it, so
# both entries are safe to list together for every platform's CI leg.
[package.metadata.packager]
product-name = "Personal Ledger TUI"
identifier = "au.id.teda.personal-ledger.tui"
formats = ["appimage", "dmg"]
# Licence and notices (#611, docs/research/package-licence-notices.md): `copyright` becomes
# the macOS `Info.plist` copyright. `resources` installs a `licenses/` folder beside the app:
# Personal Ledger's MIT LICENSE and THIRD-PARTY-NOTICES.txt (generated by cargo-about in the
# packaging workflow, see about.toml, under target/ so it is never checked in). Packager paths
# are crate-relative, hence the `../../../` prefix to the repo root. `license_file` is
# deliberately unset: it would become a click-through EULA in the dmg.
copyright = "Copyright (c) 2024–2026 Ian Teda"
resources = [
    { src = "../../../LICENSE", target = "licenses/LICENSE" },
    { src = "../../../target/THIRD-PARTY-NOTICES.txt", target = "licenses/THIRD-PARTY-NOTICES.txt" },
]
# The "Totals rule" app icon (light set) copied from the handoff in docs/ux/Logo/ -- packager
# paths are crate-relative. The PNGs feed the AppImage hicolor sizes, `.icns` the dmg and
# `.ico` Windows. Square corners are deliberate: don't round or mask the tile.
icons = [
    "icons/app-icon-16.png",
    "icons/app-icon-32.png",
    "icons/app-icon-48.png",
    "icons/app-icon-64.png",
    "icons/app-icon-128.png",
    "icons/app-icon-256.png",
    "icons/app-icon-512.png",
    "icons/app-icon.icns",
    "icons/app-icon.ico",
]

# Not strictly required now that build-publish-tui.yaml's CI invocation passes `--packages
# bin_tui` (the real fix -- cargo-packager packages every workspace member with a
# [package.metadata.packager] table unless `--packages` filters it down, confirmed for
# real on CI while adding bin-desktop's own packaging, ticket #34), but kept explicit
# anyway: with two `[[bin]]` targets now in the workspace, auto-detection is one less
# thing to trust.
[[package.metadata.packager.binaries]]
path = "tui"
main = true

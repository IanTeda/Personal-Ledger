[package]
name = "lib_ledger"
version = "0.1.0"
edition = "2024"
# Never published to crates.io; also lets cargo-deny skip licence checks on workspace crates.
publish = false
license.workspace = true

[lib]
# Usage is specified by unit tests, not doctests (see CLAUDE.md Conventions).
doctest = false

[dependencies]
## -- Internal Dependencies --
lib_core = { path = "../lib-core" }
lib_accounts = { path = "../lib-accounts" }
lib_categories = { path = "../lib-categories" }
lib_payees = { path = "../lib-payees" }
lib_tags = { path = "../lib-tags" }
lib_transactions = { path = "../lib-transactions" }
lib_budgets = { path = "../lib-budgets" }
lib_bills = { path = "../lib-bills" }
lib_documents = { path = "../lib-documents" }
lib_inventory = { path = "../lib-inventory" }
lib_institutions = { path = "../lib-institutions" }
lib_units = { path = "../lib-units" }

## -- Workspace Dependencies --
bigdecimal = { workspace = true }
chrono = { workspace = true }

[lints]
workspace = true

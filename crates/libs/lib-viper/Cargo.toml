[package]
name = "lib_viper"
version = "0.1.0"
edition = "2024"
# Never published to crates.io; also lets cargo-deny skip licence checks on workspace crates.
publish = false
license.workspace = true

[lib]
# Usage is specified by unit tests, not doctests (see CLAUDE.md Conventions).
doctest = false

[features]
# `KeyBindingConfig::overriding`, for a dependent crate's tests.
test-support = ["lib_config/test-support"]

[dependencies]
## -- Internal Dependencies --
lib_config = { path = "../lib-config" }
lib_core = { path = "../lib-core" }
lib_toast = { path = "../lib-toast" }

[dev-dependencies]
# `KeyBindingConfig::overriding`, for the keymap tests' rebinds.
lib_config = { path = "../lib-config", features = ["test-support"] }

[lints]
workspace = true

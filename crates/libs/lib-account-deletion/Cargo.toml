[package]
name = "lib_account_deletion"
version = "0.1.0"
edition = "2024"
# Never published to crates.io; also lets cargo-deny skip licence checks on workspace crates.
publish = false
license.workspace = true

[lib]
# Usage is specified by unit tests, not doctests (see CLAUDE.md Conventions).
doctest = false

[dependencies]
## -- Internal Dependencies --
## A cross-domain module depends on the feature crates it writes and nothing else
## (`docs/development/viper-architecture.md`, Rules > Dependencies).
lib_accounts = { path = "../lib-accounts" }
lib_bills = { path = "../lib-bills" }
lib_core = { path = "../lib-core" }
lib_locale = { path = "../lib-locale" }
## `Notify`, which its Router declares (ADR-0048).
lib_toast = { path = "../lib-toast" }
lib_transactions = { path = "../lib-transactions" }
lib_viper = { path = "../lib-viper" }

## -- Workspace Dependencies --
bigdecimal = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
# The port contract suite (`contract`), for `lib-database` to run against its adapter.
contract-tests = []

[build-dependencies]
lib_locale_build = { path = "../lib-locale-build" }

[lints]
workspace = true

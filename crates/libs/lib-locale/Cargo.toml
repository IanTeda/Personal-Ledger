[package]
name = "lib_locale"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
# Usage is specified by unit tests, not doctests (see CLAUDE.md Conventions).
doctest = false

[dependencies]
## -- Internal Dependencies --
lib_core = { path = "../lib-core" }

## -- Workspace Shared Dependencies --
bigdecimal = { workspace = true }
chrono = { workspace = true }
fluent-syntax = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
unic-langid = { workspace = true }

## -- Library Dependencies --
fluent-bundle = { version = "0.16.0" }
fluent-pseudo = { version = "0.3.3" }
fixed_decimal = { version = "0.7.2" }
icu_calendar = { version = "2.3.0" }
icu_casemap = { version = "2.3.0" }
icu_datetime = { version = "2.3.0" }
icu_decimal = { version = "2.3.0" }
icu_experimental = { version = "0.6.0" }
icu_locale = { version = "2.3.1" }

[build-dependencies]
lib_locale_build = { path = "../lib-locale-build" }

[dev-dependencies]
lib_locale_build = { path = "../lib-locale-build" }

[lints]
workspace = true

[package]
name = "lib_database"
version = "0.1.0"
edition = "2024"
# Never published to crates.io; also lets cargo-deny skip licence checks on workspace crates.
publish = false
license.workspace = true

[package.metadata.sqlx]
migrations = "migrations/client"


[lib]
# Usage is specified by unit tests, not doctests (see CLAUDE.md Conventions).
doctest = false

[dependencies]
## -- Internal Dependencies --
lib_config = { path = "../../../crates/libs/lib-config" }
lib_core = { path = "../../../crates/libs/lib-core", features = ["sqlx"] }
lib_units = { path = "../../../crates/libs/lib-units" }
lib_transactions = { path = "../../../crates/libs/lib-transactions" }
lib_bills = { path = "../../../crates/libs/lib-bills" }
lib_budgets = { path = "../../../crates/libs/lib-budgets" }
lib_dashboard = { path = "../../../crates/libs/lib-dashboard" }
## Only for the rail counts port `StoredShellReads` answers (#1026).
lib_shell = { path = "../../../crates/libs/lib-shell" }
## Only for the ports Settings › Ledger reads and writes the base Unit through (#1041).
lib_settings = { path = "../../../crates/libs/lib-settings" }
lib_documents = { path = "../../../crates/libs/lib-documents" }
lib_payees = { path = "../../../crates/libs/lib-payees" }
lib_institutions = { path = "../../../crates/libs/lib-institutions" }
lib_accounts = { path = "../../../crates/libs/lib-accounts" }
lib_categories = { path = "../../../crates/libs/lib-categories" }
lib_tags = { path = "../../../crates/libs/lib-tags" }
lib_inventory = { path = "../../../crates/libs/lib-inventory" }
lib_bill_payments = { path = "../../../crates/libs/lib-bill-payments" }
lib_account_deletion = { path = "../../../crates/libs/lib-account-deletion" }
lib_unit_deletion = { path = "../../../crates/libs/lib-unit-deletion" }
lib_tag_removal = { path = "../../../crates/libs/lib-tag-removal" }
lib_category_deletion = { path = "../../../crates/libs/lib-category-deletion" }
lib_transaction_import = { path = "../../../crates/libs/lib-transaction-import" }

## -- Workspace Shared Dependencies --
bigdecimal = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
## The dev seed (`seed::fake`) generates its rows, so this is not only for tests.
fake = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

## -- Library Dependencies --



[dev-dependencies]
lib_settings = { path = "../../../crates/libs/lib-settings", features = ["contract-tests"] }
lib_units = { path = "../../../crates/libs/lib-units", features = ["contract-tests"] }
lib_transactions = { path = "../../../crates/libs/lib-transactions", features = ["contract-tests"] }
lib_bills = { path = "../../../crates/libs/lib-bills", features = ["contract-tests"] }
lib_budgets = { path = "../../../crates/libs/lib-budgets", features = ["contract-tests"] }
lib_documents = { path = "../../../crates/libs/lib-documents", features = ["contract-tests"] }
lib_payees = { path = "../../../crates/libs/lib-payees", features = ["contract-tests"] }
lib_institutions = { path = "../../../crates/libs/lib-institutions", features = ["contract-tests"] }
lib_accounts = { path = "../../../crates/libs/lib-accounts", features = ["contract-tests"] }
lib_categories = { path = "../../../crates/libs/lib-categories", features = ["contract-tests"] }
lib_tags = { path = "../../../crates/libs/lib-tags", features = ["contract-tests"] }
lib_inventory = { path = "../../../crates/libs/lib-inventory", features = ["contract-tests"] }
lib_bill_payments = { path = "../../../crates/libs/lib-bill-payments", features = ["contract-tests"] }
lib_account_deletion = { path = "../../../crates/libs/lib-account-deletion", features = ["contract-tests"] }
lib_unit_deletion = { path = "../../../crates/libs/lib-unit-deletion", features = ["contract-tests"] }
lib_tag_removal = { path = "../../../crates/libs/lib-tag-removal", features = ["contract-tests"] }
lib_category_deletion = { path = "../../../crates/libs/lib-category-deletion", features = ["contract-tests"] }
lib_transaction_import = { path = "../../../crates/libs/lib-transaction-import", features = ["contract-tests"] }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

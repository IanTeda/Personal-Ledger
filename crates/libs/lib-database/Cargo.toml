[package]
name = "lib_database"
version = "0.1.0"
edition = "2024"
# Never published to crates.io; also lets cargo-deny skip licence checks on workspace crates.
publish = false

[package.metadata.sqlx]
migrations = "migrations/client"


[lib]
# Usage is specified by unit tests, not doctests (see CLAUDE.md Conventions).
doctest = false

[dependencies]
## -- Internal Dependencies --
lib_config = { path = "../../../crates/libs/lib-config" }
lib_core = { path = "../../../crates/libs/lib-core" }

## -- Workspace Shared Dependencies --
bigdecimal = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

## -- Library Dependencies --



[dev-dependencies]
## Use `fake` as a dev-dependency for tests and examples. We declare the
## version and features locally here instead of inheriting from the
## workspace to avoid manifest parsing issues when `fake` is only listed
## under `workspace.dev-dependencies` in the top-level manifest.
fake = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

# mise configuration for Personal Ledger.
#
# Installs and pins the toolchain this workspace needs. Run `mise install`
# (or just `cd` into the repo with mise's shell hook active) to fetch
# everything listed below. See https://mise.jdx.dev/.

[tools]
rust = { version = "1.98.0", components = "clippy,rustfmt" }
protoc = "36.0"
mdbook = "0.5.4"
"cargo:cargo-make" = "0.37.24"
"cargo:sqlx-cli" = "0.9.0"
"cargo:cargo-watch" = "8.5.3"
"cargo:cargo-audit" = "0.22.2"

[env]
RUST_BACKTRACE = "1"
CARGO_TERM_COLOR = "always"

# mise configuration for Personal Ledger.
#
# Installs and pins the toolchain this workspace needs, and defines the project's dev tasks
# (moved here from the former `Makefile.toml`/cargo-make setup). Run `mise install` (or just
# `cd` into the repo with mise's shell hook active) to fetch everything listed below, and
# `mise tasks` to list the tasks. See https://mise.jdx.dev/.

[tools]
rust = { version = "1.98.0", components = "clippy,rustfmt" }
protoc = "36.0"
node = "26.7.0"
mdbook = "0.5.4"
"cargo:sqlx-cli" = "0.9.0"
"cargo:bacon" = "3.26.0"
cargo-deny = "0.20.2"
uv = "0.12.5"
"pipx:graphifyy" = { version = "0.9.73", extras = "sql" }

[env]
RUST_BACKTRACE = "1"
CARGO_TERM_COLOR = "always"


# -------------------------------[WATCH]----------------------------------------

# bacon owns the inner loop: `bacon` (the clippy job) checks on save, `bacon ui -- <view>` runs one
# View's UI tests, and `bacon desktop` / `bacon tui` restart the app on save. Its jobs are in
# bacon.toml.
[tasks.watch]
description = "Run clippy on save (bacon's default job)"
run = "bacon"


# -------------------------------[TUI DEVELOPMENT]------------------------------

[tasks.watch-tui]
description = "Rebuild and rerun the TUI on file changes"
run = "bacon tui"


# -------------------------------[DESKTOP DEVELOPMENT]--------------------------

[tasks.watch-desktop]
description = "Rebuild and rerun the desktop GUI on file changes"
run = "bacon desktop"


# -------------------------------[LINT]-----------------------------------------

# `lint` runs exactly what `.github/workflows/lint.yaml` runs, so a clean `mise run lint` means a
# green Lint workflow. SQLX_OFFLINE forces lib-database's query macros onto the checked-in `.sqlx`
# cache, as in CI, instead of the live dev DB that `.env` points a local build at.
[tasks.lint]
description = "Run the CI lint checks locally: rustfmt check and clippy with warnings denied"
env = { SQLX_OFFLINE = "true" }
run = [
  "cargo fmt --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

# Headless Desktop UI integration tests (ADR-0030). `bin_desktop`'s self dev-dependency already
# turns on `test-support`, so plain `cargo test` works too; the explicit feature keeps the intent
# visible and survives that dev-dependency ever going away. SQLX_OFFLINE as in `lint`.
[tasks.end-to-end-ui]
description = "Run the headless Desktop UI integration tests (gpui test-support, no window or GPU)"
env = { SQLX_OFFLINE = "true" }
# `mise run end-to-end-ui settings_inventory` runs only the tests whose module (a file under
# tests/ui/, each View owning `<view>_keyboard.rs` and `<view>_mouse.rs`) contains the argument; no
# argument runs them all. All the UI tests are one `ui` binary (ADR-0030), so the filter is a
# test-name substring, and the lib unit tests run beside them as `--tests` did before.
# Run the full suite when closing a parent ticket (a Wayfinder map or any issue with sub-issues).
usage = 'arg "[view]" help="Substring of the tests/ui module names to run, e.g. settings_inventory"'
run = '''
set -eu
view="${usage_view:-}"
if [ -z "$view" ]; then
  exec cargo test --package bin_desktop --features test-support --lib --test ui
fi
if ! ls crates/bins/bin-desktop/tests/ui/*"$view"*.rs >/dev/null 2>&1; then
  echo "no tests/ui file name contains '$view'" >&2
  exit 1
fi
exec cargo test --package bin_desktop --features test-support --test ui -- "$view"
'''

# Applies the fixes rustfmt and clippy can make mechanically; whatever `lint` still reports
# afterwards needs a hand fix.
[tasks.lint-fix]
description = "Apply rustfmt and clippy's machine-applicable fixes"
env = { SQLX_OFFLINE = "true" }
run = [
  "cargo fmt",
  "cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets",
  "cargo fmt",
]

[tasks.deny]
description = "Check dependencies for advisories, licences, bans and sources (deny.toml)"
run = "cargo deny check"

# Opt this checkout into the repo's git hooks (`.githooks/pre-push` runs `mise run lint`).
[tasks.install-hooks]
description = "Point git at the repo's .githooks directory"
run = "git config core.hooksPath .githooks"

# -------------------------------[MD BOOK]--------------------------------------

[tasks.docs-rustdoc]
description = "Build Rust docs (with RUSTDOCFLAGS to set asset root)"
env = { RUSTDOCFLAGS = "-Z unstable-options --static-root-path /rust-docs" }
run = "cargo +nightly doc --no-deps --target-dir target/rustdoc"

# mdBook copies every non-Markdown file under docs/ into the book, gitignored or not, so a local
# build would carry the Archify receipts (with absolute home paths) beside docs/diagrams/. Delete
# whatever Git ignores under docs/ from the built book afterwards. CI's checkout has none of them.
# `docs-serve` rebuilds on every change and can't be pruned like this; it only serves localhost.
[tasks.docs-mdbook]
description = "Build mdBook documentation"
run = '''
set -eu
mdbook build
git ls-files --others --ignored --exclude-standard --directory docs/ \
  | while IFS= read -r path; do rm -rf "target/mdbook/${path#docs/}"; done
'''

[tasks.docs-build]
description = "Build all documentation (rustdoc + mdBook)"
run = "mise run docs-rustdoc && mise run docs-mdbook"

[tasks.docs-serve]
description = "Serve mdBook documentation on port 8001"
run = "mdbook serve --port 8001"

# Advisory staleness report for the Archify diagrams in docs/diagrams/ (docs/agents/issue-tracker.md,
# Diagrams). Run by hand at parent-ticket close and in a code review, never in CI or pre-push: drift
# is expected while the code is in concept, and a failing gate would push agents to re-pin without
# re-reading the code. Cited-file drift is reported but never fails the task; an HTML that no longer
# matches a re-render of its JSON does, since the HTML must be a deterministic build of the JSON.
# Rendering reads the cited evidence from the pinned commit, so it needs Node and Git but no Chrome.
[tasks.diagrams-check]
description = "Report Archify diagrams whose cited files changed since their pinned commit, and check each HTML still matches its JSON"
env = { ARCHIFY_UPDATE_CHECK_DISABLED = "1" }
run = '''
set -eu
archify=.claude/skills/archify/bin/archify.mjs
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
status=0
for json in docs/diagrams/*.json; do
  case "$json" in
    *.finalize.json|*-summary.json|*.browser-check.json|*.visual-check.json|*.delivery.json|*.delivery-pending.json|*.receipt.json) continue ;;
  esac
  slug=$(basename "$json" .json)
  html="docs/diagrams/$slug.html"
  # One line each: type, quality profile, pinned revision, then every distinct cited path.
  fields=$(node -e '
    const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
    const paths = new Set();
    (function walk(v) {
      if (Array.isArray(v)) return v.forEach(walk);
      if (v && typeof v === "object") {
        if (Array.isArray(v.sources)) v.sources.forEach(s => s && s.path && paths.add(s.path));
        Object.values(v).forEach(walk);
      }
    })(d);
    console.log([d.diagram_type, d.meta?.quality_profile ?? "showcase", d.meta?.repository?.revision ?? "", ...[...paths].sort()].join("\n"));
  ' "$json")
  type=$(printf '%s\n' "$fields" | sed -n 1p)
  quality=$(printf '%s\n' "$fields" | sed -n 2p)
  revision=$(printf '%s\n' "$fields" | sed -n 3p)
  echo "== $slug ($type)"
  foreign=0
  if [ -z "$revision" ]; then
    echo "   no meta.repository.revision: cited-file drift not checked"
  elif ! git cat-file -e "$revision^{commit}" 2>/dev/null; then
    # Evidence from another repository (e.g. zed-architecture) needs that checkout to render.
    echo "   pinned revision $revision is not in this clone: cited-file drift and re-render not checked"
    foreign=1
  else
    echo "   pinned at $(git rev-parse --short "$revision"), $(git rev-list --count "$revision..HEAD") commits behind HEAD"
    changed=0
    total=0
    while IFS= read -r path; do
      [ -n "$path" ] || continue
      total=$((total + 1))
      if ! git cat-file -e "HEAD:$path" 2>/dev/null; then
        echo "   gone     $path"
        changed=$((changed + 1))
      elif ! git diff --quiet "$revision" HEAD -- "$path"; then
        echo "   changed  $path (touched by $(git rev-list --count "$revision..HEAD" -- "$path") commits since the pin)"
        changed=$((changed + 1))
      fi
    done <<EOF
$(printf '%s\n' "$fields" | sed -n '4,$p')
EOF
    echo "   $changed of $total cited files changed or gone since the pin (advisory)"
  fi
  if [ ! -f "$html" ]; then
    echo "   MISSING  $html"
    status=1
  elif [ "$foreign" = 1 ]; then
    :
  elif ! node "$archify" render "$type" "$json" "$scratch/$slug.html" --quality "$quality" --repo-root . >"$scratch/$slug.log" 2>&1; then
    echo "   RENDER FAILED: rerun the skill's finalize to see why"
    sed 's/^/     /' "$scratch/$slug.log"
    status=1
  elif cmp -s "$scratch/$slug.html" "$html"; then
    echo "   html matches a re-render of the json"
  else
    echo "   HTML DIFFERS from a re-render of the json: re-render it, don't hand-edit it"
    status=1
  fi
done
exit "$status"
'''

[tasks.mockups]
description = "Serve the Desktop and TUI mockups on port 8002"
run = "python3 -m http.server 8002 --bind 127.0.0.1 --directory docs/ux"


# -------------------------------[DATABASE]-------------------------------------

[tasks.db-drop]
description = "Drop the dev database"
run = "sqlx database drop -y"

[tasks.db-create]
description = "Create the dev database"
run = "sqlx database create"

# Migrate database -- applies BOTH the Client-Ledger and Sync-Server migration sets to one
# shared dev database, since `cargo sqlx prepare` type-checks every query macro in the crate
# (categories, sync_users, change_sets alike) against a single DATABASE_URL. A real Client or
# Sync Server instance only ever runs its own set at runtime, via the `sqlx::migrate!(...)`
# path embedded in that binary -- see `bin-tui`/`bin-desktop` (`migrations/client`) vs
# `bin-sync-server` (`migrations/sync-server`).
[tasks.db-migrate-client]
description = "Apply the Client-Ledger migrations"
run = "sqlx migrate run --ignore-missing --source crates/libs/lib-database/migrations/client"

[tasks.db-migrate-sync-server]
description = "Apply the Sync Server migrations"
run = "sqlx migrate run --ignore-missing --source crates/libs/lib-database/migrations/sync-server"

[tasks.db-migrate]
description = "Apply both the Client-Ledger and Sync-Server migration sets"
run = "mise run db-migrate-sync-server && mise run db-migrate-client"

# DATABASE_URL points at a dev SQLite file inside the repo (`{{config_root}}` is the
# directory containing this mise.toml) so these tasks work regardless of where the repo is
# checked out; the file itself is gitignored (`*.db`).
[tasks.db-prepare-generate]
description = "Regenerate the .sqlx query cache for lib-database"
dir = "crates/libs/lib-database"
env = { DATABASE_URL = "sqlite:{{config_root}}/.personal-ledger-dev.db" }
run = "cargo sqlx prepare -- --all-targets"

[tasks.db-prepare-check]
description = "Check the .sqlx query cache is up to date (run after db-prepare-generate)"
dir = "crates/libs/lib-database"
env = { DATABASE_URL = "sqlite:{{config_root}}/.personal-ledger-dev.db" }
run = "cargo sqlx prepare --check -- --all-targets"

[tasks.db]
description = "Reset the dev database: drop, create, migrate, then refresh the sqlx query cache"
run = "mise run db-drop && mise run db-create && mise run db-migrate && mise run db-prepare-generate && mise run db-prepare-check"

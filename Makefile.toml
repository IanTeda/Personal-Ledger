
# -------------------------------[BINARY BUILDS]-------------------------------------

## Build the backend binary
[tasks.backend-build]
description = "Build the backend binary"
command = "cargo"
args = ["build", "--package", "backend", "--bin", "backend", "--release"]


# -------------------------------[MD BOOK]-------------------------------------

[tasks.docs-rustdoc]
description = "Build Rust docs (with RUSTDOCFLAGS to set asset root)"
env = { RUSTDOCFLAGS = "-Z unstable-options --static-root-path /rust-docs" }
command = "sh"
args = ["-c", "cargo +nightly doc --no-deps --target-dir target/rustdoc"]

[tasks.docs-mdbook]
description = "Build mdBook documentation"
command = "sh"
args = ["-c", "mdbook build"]

[tasks.docs-build]
description = "Build all documentation"
dependencies = ["docs-rustdoc", "docs-mdbook"]

[tasks.docs-serve]
workspace = false
install_crate = "mdbook"
description = "Serve mdBook documentation on port 8001"
command = "mdbook"
args = ["serve", "--port", "8001"]


# -------------------------------[DATABASE]------------------------------------

## Drop Database
## $ cargo make db-drop
[tasks.db-drop]
workspace = false
install_crate = "sqlx-cli"
command = "sqlx"
args = ["database", "drop", "-y"]

## Create Database
## $ cargo make db-create
[tasks.db-create]
workspace = false
install_crate = "sqlx-cli"
command = "sqlx"
args = ["database", "create"]

## Migrate database -- applies BOTH the Client-Ledger and Sync-Server migration sets to
## one shared dev database, since `cargo sqlx prepare` type-checks every query macro in
## the crate (categories, sync_users, change_sets alike) against a single DATABASE_URL.
## A real Client or Sync Server instance only ever runs its own set at runtime, via the
## `sqlx::migrate!(...)` path embedded in that binary -- see `bin-tui`/`bin-desktop`
## (`migrations/client`) vs `bin-sync-server` (`migrations/sync-server`).
## $ cargo make db-migrate
[tasks.db-migrate]
workspace = false
dependencies = ["db-migrate-client", "db-migrate-sync-server"]

[tasks.db-migrate-client]
workspace = false
install_crate = "sqlx-cli"
command = "sqlx"
args = ["migrate", "run", "--source", "crates/libs/lib-database/migrations/client"]

[tasks.db-migrate-sync-server]
workspace = false
install_crate = "sqlx-cli"
command = "sqlx"
args = ["migrate", "run", "--source", "crates/libs/lib-database/migrations/sync-server"]

## Prepare database (generate)
## $ cargo make db-prepare-generate
[tasks.db-prepare-generate]
workspace = false
install_crate = "sqlx-cli"
command = "sh"
args = ["-c", "cd crates/libs/lib-database && DATABASE_URL=\"sqlite:/home/ian/Workspaces/personal-ledger/.personal-ledger-dev.db\" cargo sqlx prepare"]

## Check the prepared queries to confirm everything is there. Should be run after db-prepare-generate
## $ cargo make db-prepare-check
[tasks.db-prepare-check]
workspace = false
install_crate = "sqlx-cli"
command = "sh"
args = ["-c", "cd crates/libs/lib-database && DATABASE_URL=\"sqlite:/home/ian/Workspaces/personal-ledger/.personal-ledger-dev.db\" cargo sqlx prepare --check"]

# Run Database tasks.
# $ cargo make db
[tasks.db]
workspace = false
dependencies = [
    "db-drop",
    "db-create",
    "db-migrate",
    "db-prepare-generate",
    "db-prepare-check",
]
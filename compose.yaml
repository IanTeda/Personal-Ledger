# Docker Compose deployment for the Sync Server (FC-SYNC-006).
#
# `docker compose up -d` builds the image from Dockerfile.sync-server (see its own
# header comment for why the build context is still the whole workspace even though
# the Dockerfile itself is named for this one service) and runs it with a named
# volume for its durable Change Set log, so the store survives `docker compose
# restart`/`down` + `up` (as opposed to `down -v`, which does remove the volume --
# that's an explicit, deliberate action, not an accidental data-loss path).
#
# PUID/PGID: override via a `.env` file or the shell environment (e.g. `PUID=1000
# PGID=1000 docker compose up -d`) to match whatever UID already owns
# sync-server-data if you're inspecting it from the host -- see docker-entrypoint.sh.
# Left unset here, they fall back to the image's own baked-in default (10001/10001).

services:
  sync-server:
    build:
      context: .
      dockerfile: Dockerfile.sync-server
    image: personal-ledger-sync-server:local
    restart: unless-stopped
    ports:
      - "50051:50051"
    environment:
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
    volumes:
      - sync-server-data:/data

volumes:
  # Named (not bind-mounted): on first run, Docker seeds it from the image's own
  # /data contents -- including the pre-created empty SQLite file docker-entrypoint.sh
  # and the Dockerfile already rely on -- so no extra init step is needed here.
  sync-server-data:
